name: Build bundle

# Rebuilds russtum-cards.js from src/ and commits it back to master,
# so you never need to run ./build.sh yourself.
on:
  push:
    branches: [master]
    paths: ['src/**', 'build.sh']
  pull_request:
    paths: ['src/**', 'build.sh']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check sources
        run: for f in src/*.js; do node --check "$f"; done

      - name: Build bundle
        run: sh build.sh && node --check russtum-cards.js

      # Only on master: commit the rebuilt bundle if it changed.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit bundle
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- russtum-cards.js; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russtum-cards.js
          git commit -m "Build russtum-cards.js from src/"
          git push
